<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.75">
    <title>Товар — Martin Moore</title>
    <meta name="description" id="metaDesc" content="Товар для животных — подробное описание, состав, отзывы. Martin Moore.">
    <link rel="stylesheet" href="index.css?v=9">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>

<body>

    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <div class="preloader-logo">Martin<span>Moore</span></div>
            <div class="preloader-paw">🐾</div>
            <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
        </div>
    </div>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Martin<span>Moore</span></a>
            <div class="search-bar" id="searchBar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Найти корм, игрушки, аксессуары..." autocomplete="off">
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
            <nav class="nav-links" id="navLinks">
                <a href="catalog.html">Каталог</a>
                <a href="blog.html">Блог</a>
                <a href="account.html">Кабинет</a>
            </nav>
            <div class="nav-actions">
                <a href="cart.html" class="btn-icon" aria-label="Корзина">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <a href="account.html" class="btn-icon" aria-label="Аккаунт">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>
                <div class="burger" id="burger"><span></span><span></span><span></span></div>
            </div>
        </div>
    </header>

    <main class="container product-page" id="productPage">
        <a href="catalog.html" class="article-back">← Назад в каталог</a>
        <div id="productContent">
            <div style="text-align:center;padding:60px 0;color:var(--text-muted)">Загрузка товара...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-about">
                    <h4>Martin<span style="color:var(--accent-light)">Moore</span></h4>
                    <p>Забота начинается с качественных продуктов.</p>
                </div>
                <div class="footer-links">
                    <h4>Каталог</h4><a href="catalog.html?animal=dogs">Для собак</a><a
                        href="catalog.html?animal=cats">Для кошек</a>
                </div>
                <div class="footer-links">
                    <h4>Покупателям</h4><a href="#">Доставка</a><a href="blog.html">Блог</a>
                </div>
                <div class="footer-links">
                    <h4>Контакты</h4><a href="tel:+78001234567">8 (800) 123-45-67</a>
                </div>
            </div>
            <div class="footer-bottom"><span>© 2026 Martin Moore</span><span>Политика конфиденциальности</span></div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Наверх">↑</button>
    <div class="toast" id="toast"></div>
    <script src="app.js?v=9"></script>
    <script>
        let currentProduct = null;
        let allProductsData = [];

        async function getProducts() {
            try {
                const res = await fetch('products.json');
                if (!res.ok) throw new Error(res.status);
                return await res.json();
            } catch (e) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'products-fallback.js';
                    script.onload = () => resolve(window.PRODUCTS_DATA || []);
                    script.onerror = () => reject(new Error('No fallback'));
                    document.head.appendChild(script);
                });
            }
        }

        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) { window.location.href = 'catalog.html'; return; }

            try {
                allProductsData = await getProducts();
                currentProduct = allProductsData.find(p => p.id === id);

                if (!currentProduct) { window.location.href = 'catalog.html'; return; }

                const p = currentProduct;
                document.title = `${p.brand} ${p.name} — Martin Moore`;
                const metaDesc = document.getElementById('metaDesc');
                if (metaDesc) metaDesc.content = p.description;

                // Gallery
                const thumbsHTML = p.images.map((img, i) => `
                    <img src="${img.replace('w=800', 'w=200')}" alt="Вид ${i + 1}" class="${i === 0 ? 'active' : ''}" onclick="changeImage(this, '${img}')">
                `).join('');

                // Features
                const featuresHTML = p.features ? p.features.map(f => `<li>${f}</li>`).join('') : '';

                // Nutrition table
                const nutritionHTML = p.nutrition ? p.nutrition.map(n => `
                    <tr><td><strong>${n.name}</strong></td><td>${n.value}</td><td>${n.norm}</td></tr>
                `).join('') : '';

                // Reviews
                const reviewsHTML = p.reviews ? p.reviews.map(r => `
                    <div class="review">
                        <div class="review-avatar">${r.initials}</div>
                        <div style="flex:1">
                            <div class="review-header">
                                <span class="review-name">${r.name}</span>
                                <span class="review-date">${r.date}</span>
                            </div>
                            <div class="product-card-rating"><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span></div>
                            <p>${r.text}</p>
                        </div>
                    </div>
                `).join('') : '<p style="color:var(--text-muted)">Пока нет отзывов</p>';

                // Badge
                let badgeHTML = '';
                if (p.oldPrice) {
                    const discount = Math.round((1 - p.price / p.oldPrice) * 100);
                    badgeHTML = `<span class="badge badge-sale">-${discount}%</span>`;
                }

                document.getElementById('productContent').innerHTML = `
                    <div class="product-layout">
                        <div class="gallery">
                            <div class="gallery-main"><img src="${p.images[0]}" alt="${p.brand} ${p.name}" id="mainImage"></div>
                            <div class="gallery-thumbs">${thumbsHTML}</div>
                        </div>
                        <div class="product-info">
                            <div class="brand">${p.brand}</div>
                            <h1>${p.name}</h1>
                            <div class="product-card-rating" style="margin:12px 0">
                                <span class="stars">${'★'.repeat(p.rating)}${'☆'.repeat(5 - p.rating)}</span>
                                <span class="count">(${p.reviewCount} отзывов)</span>
                            </div>
                            <div class="price-row">
                                <span class="price">${p.price.toLocaleString('ru-RU')} &#8381;</span>
                                ${p.oldPrice ? `<span class="old-price">${p.oldPrice.toLocaleString('ru-RU')} &#8381;</span>` : ''}
                                ${badgeHTML}
                            </div>
                            <div class="product-actions">
                                <div class="quantity">
                                    <button onclick="changeQty(-1)">−</button>
                                    <span id="qty">1</span>
                                    <button onclick="changeQty(1)">+</button>
                                </div>
                                <button class="btn btn-primary" onclick="addProductToCart()">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
                                    </svg>
                                    В корзину
                                </button>
                            </div>
                            <div class="subscribe-box">
                                <input type="checkbox" id="autoDelivery">
                                <label for="autoDelivery">
                                    <strong>Подписаться на автодоставку</strong><br>
                                    <span style="font-size:.82rem;color:var(--text-muted)">Доставка каждые 30 дней со скидкой 5%</span>
                                </label>
                            </div>
                            <div style="background:var(--bg);border-radius:var(--radius-sm);padding:16px 20px;display:flex;gap:24px;flex-wrap:wrap;font-size:.9rem">
                                <div>🚚 <strong>Доставка</strong><br><span style="color:var(--text-muted)">от 1–2 дней</span></div>
                                <div>📦 <strong>Самовывоз</strong><br><span style="color:var(--text-muted)">ПВЗ на карте</span></div>
                                <div>💳 <strong>Оплата</strong><br><span style="color:var(--text-muted)">Карта / СБП</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="tabs">
                        <div class="tab-nav">
                            <button class="active" onclick="switchTab('desc', this)">Описание</button>
                            ${nutritionHTML ? '<button onclick="switchTab(\'nutrition\', this)">Состав и БЖУ</button>' : ''}
                            <button onclick="switchTab('reviews', this)">Отзывы (${p.reviewCount})</button>
                        </div>
                        <div class="tab-content active" id="tab-desc">
                            <h3>Описание</h3>
                            <p style="margin-top:12px;line-height:1.8">${p.description}</p>
                            ${featuresHTML ? `<ul style="margin-top:16px;padding-left:20px;list-style:disc;line-height:2">${featuresHTML}</ul>` : ''}
                        </div>
                        ${nutritionHTML ? `
                        <div class="tab-content" id="tab-nutrition">
                            <h3>Состав и пищевая ценность</h3>
                            ${p.composition ? `<p style="margin:12px 0;color:var(--text-light)">${p.composition}</p>` : ''}
                            <div class="nutrition-table-wrap" style="margin-top:20px">
                            <table class="nutrition-table">
                                <thead><tr><th>Нутриент</th><th>Содержание</th><th>Уровень</th></tr></thead>
                                <tbody>${nutritionHTML}</tbody>
                            </table>
                            </div>
                        </div>` : ''}
                        <div class="tab-content" id="tab-reviews">
                            <h3 style="margin-bottom:24px">Отзывы покупателей</h3>
                            ${reviewsHTML}
                        </div>
                    </div>

                    <section style="margin-top:60px" id="similarSection">
                        <h2 class="section-title">Похожие <span>товары</span></h2>
                        <div class="products-grid" id="similarGrid"></div>
                    </section>
                `;

                // Similar products
                const similar = allProductsData
                    .filter(s => s.id !== p.id && (s.animal === p.animal || s.category === p.category))
                    .slice(0, 4);

                document.getElementById('similarGrid').innerHTML = similar.map(s => `
                    <a href="product.html?id=${s.id}" class="product-card animate-in">
                        <div class="product-card-img"><img src="${s.image}" alt="${s.brand} ${s.name}" loading="lazy"></div>
                        <div class="product-card-body">
                            <div class="product-card-brand">${s.brand}</div>
                            <div class="product-card-title">${s.name}</div>
                            <div class="product-card-rating"><span class="stars">${'★'.repeat(s.rating)}${'☆'.repeat(5 - s.rating)}</span><span class="count">(${s.reviewCount})</span></div>
                            <div class="product-card-footer">
                                <div><span class="product-card-price">${s.price.toLocaleString('ru-RU')} &#8381;</span></div>
                                <button class="add-to-cart" data-id="${s.id}" data-name="${s.brand} ${s.name}" data-price="${s.price}" data-image="${s.image}" aria-label="В корзину">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </a>
                `).join('');

                initAddToCartButtons();
                initAnimations();

            } catch (e) {
                document.getElementById('productContent').innerHTML = '<p style="text-align:center;padding:60px 0;color:var(--text-muted)">Ошибка загрузки товара.</p>';
            }
        }

        function changeImage(thumb, src) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.gallery-thumbs img').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        }

        function changeQty(d) {
            const el = document.getElementById('qty');
            let v = parseInt(el.textContent) + d;
            if (v < 1) v = 1;
            if (v > 99) v = 99;
            el.textContent = v;
        }

        function addProductToCart() {
            if (!currentProduct) return;
            const qty = parseInt(document.getElementById('qty').textContent);
            for (let i = 0; i < qty; i++) {
                addToCart({ id: currentProduct.id, name: currentProduct.brand + ' ' + currentProduct.name, price: currentProduct.price, image: currentProduct.image });
            }
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            btn.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', loadProduct);
    </script>
</body>

</html>
