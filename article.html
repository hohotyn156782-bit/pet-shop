<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья — Martin Moore</title>
    <meta name="description" id="metaDesc" content="Полезная статья о питомцах от Martin Moore.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
    <link rel="stylesheet" href="index.css?v=9">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
</head>

<body>

    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <div class="preloader-logo">Martin<span>Moore</span></div>
            <div class="preloader-paw">🐾</div>
            <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
        </div>
    </div>

    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Martin<span>Moore</span></a>
            <div class="search-bar" id="searchBar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Найти корм, игрушки, аксессуары..." autocomplete="off">
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
            <nav class="nav-links" id="navLinks">
                <a href="catalog.html">Каталог</a>
                <a href="blog.html" style="color:var(--accent)">Блог</a>
                <a href="account.html">Кабинет</a>
            </nav>
            <div class="nav-actions">
                <a href="cart.html" class="btn-icon" aria-label="Корзина">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1" />
                        <circle cx="20" cy="21" r="1" />
                        <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
                    </svg>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
                <a href="account.html" class="btn-icon" aria-label="Аккаунт">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </a>
                <button class="burger" id="burger" aria-label="Меню" type="button"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main class="container article-page">
        <a href="blog.html" class="article-back">← Назад к блогу</a>

        <article id="articleContent">
            <!-- Заполняется через JS -->
        </article>

        <!-- Похожие статьи -->
        <section class="related-articles" id="relatedArticles">
            <h2 class="section-title">Читайте <span>также</span></h2>
            <div class="blog-grid" id="relatedGrid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-about">
                    <h4>Martin<span style="color:var(--accent-light)">Moore</span></h4>
                    <p>Забота начинается с качественных продуктов.</p>
                </div>
                <div class="footer-links">
                    <h4>Каталог</h4><a href="catalog.html?animal=dogs">Для собак</a><a
                        href="catalog.html?animal=cats">Для кошек</a>
                </div>
                <div class="footer-links">
                    <h4>Покупателям</h4><a href="javascript:void(0)" onclick="showToast('Страница в разработке')">Доставка</a><a href="blog.html">Блог</a>
                </div>
                <div class="footer-links">
                    <h4>Контакты</h4><a href="tel:+78001234567">8 (800) 123-45-67</a>
                </div>
            </div>
            <div class="footer-bottom"><span>© 2026 Martin Moore</span><span>Политика конфиденциальности</span></div>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Наверх">↑</button>
    <div class="toast" id="toast"></div>
    <script src="app.js?v=9"></script>
    <script>
        async function getArticles() {
            try {
                const res = await fetch('articles.json');
                if (!res.ok) throw new Error(res.status);
                return await res.json();
            } catch (e) {
                // Фоллбэк для file://
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = 'articles-fallback.js';
                    script.onload = () => resolve(window.ARTICLES_DATA || []);
                    script.onerror = () => reject(new Error('No fallback'));
                    document.head.appendChild(script);
                });
            }
        }

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            if (!id) { window.location.href = 'blog.html'; return; }

            try {
                const articles = await getArticles();
                const article = articles.find(a => a.id === id);

                if (!article) { window.location.href = 'blog.html'; return; }

                document.title = `${article.title} — Martin Moore`;
                const metaDesc = document.getElementById('metaDesc');
                if (metaDesc) metaDesc.content = article.excerpt;

                const dateFormatted = new Date(article.date).toLocaleDateString('ru-RU', {
                    day: 'numeric', month: 'long', year: 'numeric'
                });

                let contentHTML = article.content.map(block => {
                    switch (block.type) {
                        case 'text':
                            return `<p>${block.value}</p>`;
                        case 'heading':
                            return `<h2>${block.value}</h2>`;
                        case 'list':
                            return `<ul>${block.value.map(li => `<li>${li}</li>`).join('')}</ul>`;
                        case 'quote':
                            return `<blockquote>${block.value}</blockquote>`;
                        default:
                            return `<p>${block.value}</p>`;
                    }
                }).join('');

                document.getElementById('articleContent').innerHTML = `
                    <div class="article-hero">
                        <img src="${article.imageLarge}" alt="${article.title}" loading="lazy">
                    </div>
                    <div class="article-meta">
                        <span class="article-tag">${article.tag}${article.animal ? ' • ' + article.animal : ''}</span>
                        <span class="article-date">${dateFormatted}</span>
                        <span class="article-read">📖 ${article.readTime} мин чтения</span>
                    </div>
                    <h1 class="article-title">${article.title}</h1>
                    <div class="article-body">${contentHTML}</div>
                    <div class="article-share">
                        <span>Поделиться:</span>
                        <a href="#" onclick="copyLink(event)">🔗 Копировать ссылку</a>
                    </div>
                `;

                // Похожие статьи (другие, кроме текущей, максимум 3)
                const related = articles.filter(a => a.id !== id).slice(0, 3);
                document.getElementById('relatedGrid').innerHTML = related.map(a => `
                    <a href="article.html?id=${a.id}" class="blog-card animate-in">
                        <div class="blog-card-img"><img src="${a.image}" alt="${a.title}" loading="lazy"></div>
                        <div class="blog-card-body">
                            <div class="blog-card-tag">${a.tag}${a.animal ? ' • ' + a.animal : ''}</div>
                            <h3>${a.title}</h3>
                            <p>${a.excerpt}</p>
                        </div>
                    </a>
                `).join('');

                initAnimations();
            } catch (e) {
                document.getElementById('articleContent').innerHTML = '<p>Ошибка загрузки статьи.</p>';
            }
        }

        function copyLink(e) {
            e.preventDefault();
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('Ссылка скопирована! 📋');
            });
        }

        document.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>

</html>
